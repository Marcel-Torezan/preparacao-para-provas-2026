<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preparação para Provas 2026 · Simulado ENEM</title>
<link rel="stylesheet" href="css/global.css">
</head>
<body>

<!-- OVERLAY DE LOGIN -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <div class="login-icon">📘</div>
    <h2>Acesso ao Sistema</h2>
    <p>Digite a senha de acesso para continuar</p>
    <form id="loginForm" onsubmit="validarLogin(event)">
      <input type="password" id="senhaInput" placeholder="Sua senha..." required>
      <button type="submit" class="btn-login">Entrar</button>
      <div id="erroMsg" class="erro-msg"></div>
    </form>
  </div>
</div>

<header class="topo">
  <div class="wrap">
    <a href="#" class="logo" onclick="home();return false">📘 Preparação para Provas <span>2026</span></a>
    <div id="timer" class="timer" hidden>⏱ <span id="t">--:--:--</span></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="rodape wrap">Simulado independente, sem vínculo com o INEP. Questões originais no estilo ENEM.</footer>
<script src="data/banco.js"></script>
<script src="js/app.js"></script>
</body>
</html>
